name: ci

on:
  push:
    branches:
      - main
      - estudo-java
  pull_request:
    branches:
      - main

jobs:
  run-all-mains:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer o checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Altere se usar outra versão
          distribution: 'temurin'

      - name: Compilar projeto e executar todas as mains
        run: |
          echo "Buscando arquivos Java no projeto..."
          
          # Cria um arquivo de texto com o caminho de TODOS os .java do repositório
          find . -name "*.java" > sources.txt
          
          if [ ! -s sources.txt ]; then
            echo "Nenhum arquivo Java encontrado no repositório."
            exit 0
          fi
          
          # Cria a pasta para onde os arquivos compilados vão
          mkdir -p out_classes
          
          echo "Compilando todos os arquivos..."
          javac -d out_classes @sources.txt
          
          echo "Procurando por classes com método 'public static void main'..."
          
          # Busca todos os arquivos .java que tenham o método main escrito dentro
          ARQUIVOS_MAIN=$(grep -rl "public static void main" . | grep '\.java$' || true)
          
          if [ -z "$ARQUIVOS_MAIN" ]; then
            echo "Nenhuma classe com método main foi encontrada."
            exit 0
          fi
          
          for ARQUIVO in $ARQUIVOS_MAIN; do
            # Extrai apenas a parte do caminho depois de '/src/' para pegar a estrutura de pacotes
            # Ex: ./exercicios/src/br/com/pacote/App.java vira br/com/pacote/App.java
            CAMINHO_RELATIVO=$(echo "$ARQUIVO" | sed -n 's/.*\/src\/\(.*\)/\1/p')
          
            if [ -n "$CAMINHO_RELATIVO" ]; then
              # Substitui as barras por pontos para formar o nome do pacote (br.com.pacote.App)
              CLASSE_COMPLETA=$(echo "$CAMINHO_RELATIVO" | sed 's/\//./g' | sed 's/\.java//')
          
              echo "=================================================="
              echo "▶ Executando: $CLASSE_COMPLETA"
              echo "=================================================="
          
              # Executa a classe apontando para a pasta onde tudo foi compilado
              java -cp out_classes "$CLASSE_COMPLETA"
          
              echo ""
            fi
          done