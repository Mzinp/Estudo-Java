name: ci

on:
  push:
    branches:
      - main
      - estudo-java
  pull_request:
    branches:
      - main

jobs:
  run-all-mains:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer o checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Altere se usar outra versão
          distribution: 'temurin'

      - name: Compilar projeto e executar todas as mains
        run: |
          echo "Buscando arquivos Java no projeto..."
          find . -name "*.java" > sources.txt
          
          if [ ! -s sources.txt ]; then
            echo "Nenhum arquivo Java encontrado no repositório."
            exit 0
          fi
          
          mkdir -p out_classes
          echo "Compilando todos os arquivos..."
          javac -d out_classes @sources.txt
          
          echo "Procurando por classes com método main..."
          # O parâmetro -E permite usar Regex. Ele vai achar qualquer variação de "static void main (" com ou sem "public" e com qualquer espaçamento.
          ARQUIVOS_MAIN=$(grep -rlE "(public[[:space:]]+)?static[[:space:]]+void[[:space:]]+main[[:space:]]*\(" . | grep '\.java$' || true)
          
          if [ -z "$ARQUIVOS_MAIN" ]; then
            echo "Nenhuma classe com método main foi encontrada."
            exit 0
          fi
          
          for ARQUIVO in $ARQUIVOS_MAIN; do
            NOME_CLASSE=$(basename "$ARQUIVO" .java)
          
            # Pega o pacote ignorando espaços extras
            PACOTE=$(grep -m 1 "^[[:space:]]*package" "$ARQUIVO" | awk '{print $2}' | tr -d ';\r' || true)
          
            if [ -n "$PACOTE" ]; then
              CLASSE_COMPLETA="$PACOTE.$NOME_CLASSE"
            else
              CLASSE_COMPLETA="$NOME_CLASSE"
            fi
          
            echo "=================================================="
            echo "▶ Executando: $CLASSE_COMPLETA"
            echo "=================================================="
          
            java -cp out_classes "$CLASSE_COMPLETA" || echo "⚠️ A execução de $CLASSE_COMPLETA falhou (verifique se o main tem String[] args)."
          
            echo ""
          done